services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: strideguard-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Stride@Guard2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - strideguard_sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Stride@Guard2026!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strideguard-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=StrideGuardDb;User Id=sa;Password=Stride@Guard2026!;TrustServerCertificate=True;"
    ports:
      - "5000:8080"
    restart: unless-stopped

volumes:
  strideguard_sqldata:
